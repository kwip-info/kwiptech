{% extends "_layouts/public.html" %}

{% block title %}Sign up - scoped{% endblock %}

{% block page_content %}
<div class="flex items-center justify-center py-16">
    <div id="clerk-sign-up"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    onClerkReady(function (clerk) {
        if (clerk.user) {
            syncClerkSession(clerk).then(function () {
                window.location.replace("/dashboard/");
            });
            return;
        }
        clerk.mountSignUp(document.getElementById("clerk-sign-up"), {
            routing: "path",
            path: "/sign-up",
            signInUrl: "/sign-in",
        });
        clerk.addListener(function () {
            if (clerk.user) {
                syncClerkSession(clerk).then(function () {
                    window.location.replace("/dashboard/");
                });
            }
        });
    });
</script>
{% endblock %}
