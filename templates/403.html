{% extends "_layouts/public.html" %}

{% block title %}Access denied - scoped{% endblock %}

{% block page_content %}
<div class="text-center py-24">
    <p class="text-sm font-semibold text-brand-600">403</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight text-gray-900">Access denied</h1>
    <p class="mt-2 text-base text-gray-500">You don't have permission to access this page.</p>
    <div class="mt-6">
        {% if clerk_user %}
        <a href="/dashboard/" class="text-sm font-semibold text-brand-600 hover:text-brand-500">
            Back to dashboard
        </a>
        {% else %}
        <a href="/" class="text-sm font-semibold text-brand-600 hover:text-brand-500">
            Back to home
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
