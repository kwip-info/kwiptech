{% extends "_layouts/public.html" %}

{% block page_content %}
<div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900">{% block legal_title %}{% endblock %}</h1>
    <p class="mt-2 text-sm text-gray-500">Last updated: {% block legal_date %}{% endblock %}</p>
    <div class="mt-10 prose prose-sm prose-gray max-w-none
                [&_h2]:text-lg [&_h2]:font-bold [&_h2]:text-gray-900 [&_h2]:mt-10 [&_h2]:mb-4
                [&_h3]:text-base [&_h3]:font-semibold [&_h3]:text-gray-900 [&_h3]:mt-6 [&_h3]:mb-2
                [&_p]:text-sm [&_p]:text-gray-600 [&_p]:mb-4 [&_p]:leading-relaxed
                [&_ul]:text-sm [&_ul]:text-gray-600 [&_ul]:mb-4 [&_ul]:ml-4 [&_ul]:list-disc
                [&_li]:mb-1">
        {% block legal_content %}{% endblock %}
    </div>
</div>
{% endblock %}
