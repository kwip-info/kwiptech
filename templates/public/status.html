{% extends "_layouts/public.html" %}

{% block title %}Status - scoped{% endblock %}

{% block page_content %}
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-24">
    <div class="text-center">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">System status</h1>
        <p class="mt-4 text-base text-gray-600">
            Current operational status of the scoped management plane.
        </p>
    </div>

    <!-- Health check -->
    <div class="mt-16 mx-auto max-w-xl" x-data="{ status: 'checking', lastChecked: '' }">
        <div class="rounded-lg border border-gray-200 bg-white p-6">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-semibold text-gray-900">Management Plane API</h3>
                    <p class="mt-1 text-xs text-gray-500" x-text="lastChecked ? 'Checked ' + lastChecked : 'Checking...'"></p>
                </div>
                <div hx-get="/v1/ping"
                     hx-trigger="load, every 30s"
                     hx-swap="none"
                     @htmx:after-request.window="
                         if ($event.detail.successful) {
                             status = 'operational';
                         } else {
                             status = 'degraded';
                         }
                         lastChecked = new Date().toLocaleTimeString();
                     ">
                    <span x-show="status === 'checking'"
                          class="inline-flex items-center rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-600">
                        Checking
                    </span>
                    <span x-show="status === 'operational'" x-cloak
                          class="inline-flex items-center rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700">
                        Operational
                    </span>
                    <span x-show="status === 'degraded'" x-cloak
                          class="inline-flex items-center rounded-full bg-red-100 px-3 py-1 text-xs font-medium text-red-700">
                        Degraded
                    </span>
                </div>
            </div>
        </div>

        <p class="mt-6 text-center text-xs text-gray-400">
            Auto-refreshes every 30 seconds
        </p>
    </div>
</div>
{% endblock %}
