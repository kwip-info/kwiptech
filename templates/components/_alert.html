<!-- Global alert container — managed by Alpine.js -->
<div x-data="alertManager()" x-cloak
     @alert.window="show($event.detail)"
     class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
    <template x-for="alert in alerts" :key="alert.id">
        <div x-show="alert.visible"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="rounded-md px-4 py-3 shadow-lg max-w-sm flex items-center gap-3"
             :class="{
                 'bg-green-50 text-green-800 border border-green-200': alert.type === 'success',
                 'bg-red-50 text-red-800 border border-red-200': alert.type === 'error',
                 'bg-yellow-50 text-yellow-800 border border-yellow-200': alert.type === 'warning',
                 'bg-blue-50 text-blue-800 border border-blue-200': alert.type === 'info',
             }">
            <p class="text-sm font-medium" x-text="alert.message"></p>
            <button @click="dismiss(alert.id)"
                    class="text-current opacity-50 hover:opacity-100 ml-auto shrink-0">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </template>
</div>
