{% if organization and not hide_toggles %}
{% with apps=organization.applications.all %}
{% if apps.count > 1 %}
<div x-data="{ open: false }" class="relative" @click.away="open = false">
    <button @click="open = !open"
            class="flex items-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-medium text-gray-700 ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
        <span>{{ active_app.name|default:"Select app" }}</span>
        <svg class="h-3 w-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div x-show="open" x-transition
         class="absolute right-0 z-10 mt-1 w-48 rounded-md bg-white shadow-lg ring-1 ring-black/5">
        <div class="py-1">
            {% for app in apps %}
            <form method="post" action="{% url 'dashboard:set_app' %}" class="contents">
                {% csrf_token %}
                <input type="hidden" name="application" value="{{ app.id }}">
                <button type="submit"
                        class="block w-full px-4 py-2 text-left text-sm
                               {% if active_app and active_app.id == app.id %}bg-gray-50 font-medium text-gray-900{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
                    {{ app.name }}
                </button>
            </form>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
{% endwith %}
{% endif %}
