{% load dashboard_tags %}
{% active_env as env %}
<div x-data="{ env: '{{ env }}' }" class="flex items-center gap-1 rounded-lg bg-gray-100 p-0.5">
    <form method="post" action="{% url 'dashboard:set_env' %}" class="contents">
        {% csrf_token %}
        <input type="hidden" name="environment" value="test">
        <button type="submit"
                class="rounded-md px-3 py-1 text-xs font-medium transition-colors
                       {% if env == 'test' %}bg-white text-gray-900 shadow-sm{% else %}text-gray-500 hover:text-gray-700{% endif %}">
            Test
        </button>
    </form>
    <form method="post" action="{% url 'dashboard:set_env' %}" class="contents">
        {% csrf_token %}
        <input type="hidden" name="environment" value="live">
        <button type="submit"
                class="rounded-md px-3 py-1 text-xs font-medium transition-colors
                       {% if env == 'live' %}bg-white text-gray-900 shadow-sm{% else %}text-gray-500 hover:text-gray-700{% endif %}">
            Live
        </button>
    </form>
</div>
