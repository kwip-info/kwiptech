<div x-data="{ open: false }">
    <button @click="open = true" type="button"
            class="rounded-md bg-brand-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-brand-500">
        Create key
    </button>

    <!-- Backdrop -->
    <div x-show="open" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-40 bg-gray-900/50"
         @click="open = false">
    </div>

    <!-- Modal -->
    <div x-show="open" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl" @click.outside="open = false">
            <h3 class="text-lg font-semibold text-gray-900">Create API key</h3>
            <p class="mt-1 text-sm text-gray-500">
                This key will be created for the {{ active_env }} environment.
            </p>

            <form method="post" action="{% url 'dashboard:keys' %}" class="mt-4">
                {% csrf_token %}
                <label for="key-label" class="block text-sm font-medium text-gray-700">
                    Label (optional)
                </label>
                <input type="text" name="label" id="key-label"
                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-brand-500 focus:ring-brand-500"
                       maxlength="128">

                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" @click="open = false"
                            class="rounded-md px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit"
                            class="rounded-md bg-brand-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-brand-500">
                        Create
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
