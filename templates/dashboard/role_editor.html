{% extends "_layouts/dashboard.html" %}

{% block title %}{{ page_title }} - scoped{% endblock %}

{% block page_content %}
<form method="post" class="max-w-2xl">
    {% csrf_token %}

    <!-- Role name -->
    <div class="mb-6">
        <label for="role-name" class="block text-sm font-medium text-gray-700 mb-1">Role name</label>
        <input type="text" name="name" id="role-name"
               value="{{ role.name|default:'' }}"
               class="block w-full rounded-md border-gray-300 shadow-sm text-sm
                      focus:border-fuchsia-500 focus:ring-fuchsia-500 px-3 py-2
                      ring-1 ring-inset ring-gray-300"
               placeholder="e.g., Billing Manager"
               required>
    </div>

    <!-- Permission matrix -->
    <div class="space-y-6">
        {% for category, perms in categories.items %}
        <div>
            <h3 class="text-sm font-semibold text-gray-900 capitalize mb-2">{{ category }}</h3>
            <div class="space-y-2">
                {% for perm in perms %}
                <label class="flex items-start gap-3 rounded-md border border-gray-200 bg-white p-3 cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" name="permissions" value="{{ perm.id }}"
                           {% if perm.id in selected_perms %}checked{% endif %}
                           class="mt-0.5 h-4 w-4 rounded border-gray-300 text-fuchsia-600 focus:ring-fuchsia-500">
                    <div>
                        <p class="text-sm font-medium text-gray-900">{{ perm.name }}</p>
                        <p class="text-xs text-gray-500">{{ perm.description }}</p>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Actions -->
    <div class="mt-8 flex items-center gap-3">
        <button type="submit"
                class="rounded-md bg-fuchsia-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-fuchsia-500">
            {% if role %}Save Changes{% else %}Create Role{% endif %}
        </button>
        <a href="{% url 'dashboard:roles' %}"
           class="rounded-md px-4 py-2 text-sm font-medium text-gray-700 ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
