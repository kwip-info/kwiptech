<div class="rounded-lg border border-gray-200 bg-white p-5">
    <p class="text-sm font-medium text-gray-500">{{ card_title }}</p>
    <p class="mt-2 text-2xl font-semibold text-gray-900">{{ card_value }}</p>
    {% if card_subtitle %}
        <p class="mt-1 text-sm text-gray-500">{{ card_subtitle }}</p>
    {% endif %}
    {% if card_link and card_link_text %}
        <a href="{{ card_link }}" class="mt-3 inline-block text-sm font-medium text-brand-600 hover:text-brand-500">
            {{ card_link_text }}
        </a>
    {% endif %}
</div>
