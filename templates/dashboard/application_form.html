{% extends "_layouts/dashboard.html" %}

{% block title %}{{ page_title }} - scoped{% endblock %}

{% block page_content %}
<form method="post" class="max-w-md">
    {% csrf_token %}
    <div class="mb-6">
        <label for="app-name" class="block text-sm font-medium text-gray-700 mb-1">Application name</label>
        <input type="text" name="name" id="app-name"
               value="{{ form_name|default:'' }}"
               class="block w-full rounded-md border-gray-300 shadow-sm text-sm
                      focus:border-fuchsia-500 focus:ring-fuchsia-500 px-3 py-2
                      ring-1 ring-inset ring-gray-300"
               placeholder="e.g., My SaaS App"
               required autofocus>
        <p class="mt-1 text-xs text-gray-500">
            Each application has its own API keys and environments.
        </p>
    </div>
    <div class="flex items-center gap-3">
        <button type="submit"
                class="rounded-md bg-fuchsia-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-fuchsia-500">
            {% if app %}Save Changes{% else %}Create Application{% endif %}
        </button>
        <a href="{% url 'dashboard:applications' %}"
           class="rounded-md px-4 py-2 text-sm font-medium text-gray-700 ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
