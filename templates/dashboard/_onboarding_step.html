<div class="rounded-lg border border-gray-200 bg-white p-5">
    <div class="flex items-start gap-4">
        <!-- Step indicator -->
        <div class="shrink-0 mt-0.5">
            {% if step_complete %}
            <div class="flex h-6 w-6 items-center justify-center rounded-full bg-brand-600">
                <svg class="h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </div>
            {% else %}
            <div class="flex h-6 w-6 items-center justify-center rounded-full border-2 border-gray-300">
                <span class="text-xs font-medium text-gray-500">{{ step_number }}</span>
            </div>
            {% endif %}
        </div>

        <!-- Content -->
        <div class="flex-1 min-w-0">
            <h3 class="text-sm font-semibold text-gray-900">{{ step_title }}</h3>
            <p class="mt-1 text-sm text-gray-600">{{ step_description }}</p>

            {% if step_content %}
            <div class="mt-3">
                {{ step_content }}
            </div>
            {% endif %}

            {% if step_action_url and not step_complete %}
            <div class="mt-3">
                <a href="{{ step_action_url }}"
                   class="inline-flex items-center rounded-md bg-brand-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-brand-500">
                    {{ step_action_text }}
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
