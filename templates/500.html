<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server error - scoped</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .container { text-align: center; max-width: 28rem; padding: 1rem; }
        .code {
            font-size: 0.875rem;
            font-weight: 600;
            color: #1a4fff;
        }
        h1 {
            margin-top: 0.5rem;
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }
        p {
            margin-top: 0.5rem;
            font-size: 1rem;
            color: #6b7280;
        }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1a4fff;
            text-decoration: none;
        }
        a:hover { color: #3b6cff; }
    </style>
</head>
<body>
    <div class="container">
        <p class="code">500</p>
        <h1>Something went wrong</h1>
        <p>An unexpected error occurred. Our team has been notified.</p>
        <a href="/">Back to dashboard</a>
    </div>
</body>
</html>
