name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kwiptech-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check plane/ uat/ --select E,W,F --ignore E402,E501,E731,E741

      - run: node --check static/market/app.js

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django: ['>=5.2,<5.3', '>=6.0,<6.1']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kwip_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kwip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kwip_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt 'Django${{ matrix.django }}'
      - run: python -m pytest --tb=short -q
      - run: python manage.py check && python manage.py migrate --noinput && python manage.py makemigrations --check --dry-run
        env:
          DATABASE_URL: postgres://kwip_test:test-only@127.0.0.1:5432/kwip_test
      - run: python manage.py collectstatic --noinput
      - run: python -m pytest --tb=short -q --ds=plane.settings
        env:
          DATABASE_URL: postgres://kwip_test:test-only@127.0.0.1:5432/kwip_test
          ALLOWED_HOSTS: localhost,testserver
          DEBUG: 'true'
      - run: python manage.py collectstatic --noinput

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy tested commit to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          cat > "$RUNNER_TEMP/heroku-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' heroku ;;
            *) printf '%s\n' "$HEROKU_API_KEY" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/heroku-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/heroku-askpass"
          export GIT_TERMINAL_PROMPT=0
          git push "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main --force
      - name: Verify marketplace and preserved cutover
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://kwip.tech/healthz > "$RUNNER_TEMP/health.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/health.json")); assert d["status"] == "ok" and d["ingestion"] == "retired" and d["pyscoped"] == "2.0.0"'
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' https://kwip.tech/v1/sync/batch)
          test "$code" = 410
          curl --fail --silent --show-error https://kwip.tech/ | grep -q "Find the facts."
          curl --fail --silent --show-error https://kwip.tech/api/v2/datasets > "$RUNNER_TEMP/catalog.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/catalog.json")); assert isinstance(d["datasets"], list)'
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://kwip.tech/_uat/session)
          test "$code" = 404
          destination=$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' https://kwip.tech/digest)
          test "$destination" = https://kwip.info/technology/digest/
