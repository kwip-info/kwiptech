name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kwiptech-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check plane/ --select E,W --ignore E402,E501,E731,E741

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django: ['>=5.2,<5.3', '>=6.0,<6.1']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kwip_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kwip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kwip_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt 'Django${{ matrix.django }}'
      - run: python -m pytest --tb=short -q
      - run: python manage.py check && python manage.py migrate --noinput && python manage.py makemigrations --check --dry-run
        env:
          DATABASE_URL: postgres://kwip_test:test-only@127.0.0.1:5432/kwip_test
      - run: python manage.py collectstatic --noinput
      - run: python -m pytest --tb=short -q --ds=plane.settings
        env:
          DATABASE_URL: postgres://kwip_test:test-only@127.0.0.1:5432/kwip_test
          ALLOWED_HOSTS: localhost,testserver
          DEBUG: 'true'
      - run: python manage.py collectstatic --noinput

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy tested commit to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          cat > "$RUNNER_TEMP/heroku-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' heroku ;;
            *) printf '%s\n' "$HEROKU_API_KEY" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/heroku-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/heroku-askpass"
          export GIT_TERMINAL_PROMPT=0
          git push "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main --force
