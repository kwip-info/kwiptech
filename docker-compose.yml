version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pyscoped_plane
      POSTGRES_USER: pyscoped
      POSTGRES_PASSWORD: pyscoped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings
      DJANGO_DEBUG: "true"
      POSTGRES_DB: pyscoped_plane
      POSTGRES_USER: pyscoped
      POSTGRES_PASSWORD: pyscoped
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  pgdata:
