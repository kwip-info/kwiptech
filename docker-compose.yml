services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: pyscoped_plane
      POSTGRES_USER: pyscoped
      POSTGRES_PASSWORD: pyscoped
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyscoped -d pyscoped_plane"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh /app/docker-entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
  static_volume:
